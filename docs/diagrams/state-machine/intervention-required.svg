<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 544" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">intervention_required state</title>
  <desc id="desc">intervention_required is entered when the reset budget is used up, old Pods outlive a reset, a group doesn't start or finish replacing in 10 minutes, or Kubernetes is unreadable for 10 minutes. Nothing is deleted. Only a new group with no shared Pods that verifies leads back to serving.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C8549"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0443F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6BA8"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E5BA6"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B97A10"/></marker>
    <marker id="arrow-maroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1E1E"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
  </defs>
  <rect x="5" y="5" width="1590" height="534" rx="10" fill="#FFFFFF" stroke="#A46BAA" stroke-width="10"/>
  <!-- state -->
  <rect x="540" y="45" width="560" height="454" rx="18" fill="#F1D6D6" stroke="#8B1E1E" stroke-width="3"/>
  <text x="570" y="93" font-size="28" font-weight="700" text-anchor="start" fill="#1E1E1E">intervention_required</text>
  <text x="570" y="123" font-size="17" font-weight="400" text-anchor="start" fill="#5A5A5A">waiting for a human</text>
  <text x="570" y="185" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">ON ENTRY</text>
  <circle cx="580" cy="213" r="4" fill="#8B1E1E"/>
  <text x="596" y="219" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Nothing is deleted</text>
  <text x="570" y="265" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">EVERY TICK, IN ORDER</text>
  <circle cx="584" cy="295" r="13" fill="#8B1E1E"/>
  <text x="584" y="300" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="610" y="301" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Same group, or shares Pods → nothing</text>
  <circle cx="584" cy="325" r="13" fill="#8B1E1E"/>
  <text x="584" y="330" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="610" y="331" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">New group, not all healthy → wait</text>
  <circle cx="584" cy="355" r="13" fill="#8B1E1E"/>
  <text x="584" y="360" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="610" y="361" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">New group healthy → verify</text>
  <!-- comes from -->
  <text x="60" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">COMES FROM</text>
  <rect x="60" y="153" width="190" height="38" rx="19" fill="#FFFFFF" stroke="#C0443F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="155" y="177" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">reset</text>
  <text x="265" y="166" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">4th reset</text>
  <text x="265" y="188" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">in 30 min</text>
  <path d="M468,172 L536,172" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="60" y="246" width="190" height="38" rx="19" fill="#F9E1DF" stroke="#C0443F" stroke-width="2.5"/>
  <text x="155" y="270" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">resetting</text>
  <text x="265" y="259" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">old Pods after</text>
  <text x="265" y="281" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">10 min</text>
  <path d="M468,265 L536,265" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="60" y="340" width="190" height="38" rx="19" fill="#E4ECF7" stroke="#3F6BA8" stroke-width="2.5"/>
  <text x="155" y="364" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">starting</text>
  <text x="265" y="353" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">not healthy, or not</text>
  <text x="265" y="375" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">replaced, in 10 min</text>
  <path d="M468,359 L536,359" fill="none" stroke="#3F6BA8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="60" y="433" width="190" height="38" rx="19" fill="#EDEDED" stroke="#7A7A7A" stroke-width="2.5"/>
  <text x="155" y="457" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">any state</text>
  <text x="265" y="446" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">Kubernetes</text>
  <text x="265" y="468" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">unreadable 10 min</text>
  <path d="M468,452 L536,452" fill="none" stroke="#7A7A7A" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <!-- goes to -->
  <text x="1160" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">GOES TO</text>
  <path d="M1104,187 L1224,187" fill="none" stroke="#8B1E1E" stroke-width="2.5" marker-end="url(#arrow-maroon)"/>
  <circle cx="1244" cy="187" r="13" fill="#8B1E1E"/>
  <text x="1244" y="192" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="1274" cy="187" r="13" fill="#8B1E1E"/>
  <text x="1274" y="192" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <rect x="1300" y="168" width="190" height="38" rx="19" fill="#F1D6D6" stroke="#8B1E1E" stroke-width="2.5"/>
  <text x="1395" y="192" font-size="14" font-weight="700" text-anchor="middle" fill="#1E1E1E">intervention_required</text>
  <text x="1395" y="227" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">stay</text>
  <path d="M1104,312 L1254,312" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <circle cx="1274" cy="312" r="13" fill="#8B1E1E"/>
  <text x="1274" y="317" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <rect x="1300" y="293" width="190" height="38" rx="19" fill="#E2F1E7" stroke="#2C8549" stroke-width="2.5"/>
  <text x="1395" y="317" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">serving</text>
  <text x="1395" y="352" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">verified</text>
  <path d="M1104,437 L1254,437" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <circle cx="1274" cy="437" r="13" fill="#8B1E1E"/>
  <text x="1274" y="442" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <rect x="1300" y="418" width="190" height="38" rx="19" fill="#FFFFFF" stroke="#C0443F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="1395" y="442" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">reset</text>
  <text x="1395" y="477" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">verification fails</text>
</svg>
