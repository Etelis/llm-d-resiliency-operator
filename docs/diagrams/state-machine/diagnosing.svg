<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 612" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">diagnosing state</title>
  <desc id="desc">diagnosing is entered from serving when a rank is unknown or reports a fault. On entry it starts a 75 second clock and may probe idle ranks once. Each tick it checks, in order: healthy again, reset decided, deadline, still waiting, a retry too soon, then saves and sends a round.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C8549"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0443F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6BA8"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E5BA6"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B97A10"/></marker>
    <marker id="arrow-maroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1E1E"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
  </defs>
  <rect x="5" y="5" width="1590" height="602" rx="10" fill="#FFFFFF" stroke="#A46BAA" stroke-width="10"/>
  <!-- state -->
  <rect x="540" y="45" width="560" height="522" rx="18" fill="#FCF0D6" stroke="#B97A10" stroke-width="3"/>
  <text x="570" y="93" font-size="28" font-weight="700" text-anchor="start" fill="#1E1E1E">diagnosing</text>
  <text x="570" y="123" font-size="17" font-weight="400" text-anchor="start" fill="#5A5A5A">waiting for the engine</text>
  <text x="570" y="185" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">ON ENTRY</text>
  <circle cx="580" cy="213" r="4" fill="#B97A10"/>
  <text x="596" y="219" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Start the 75 s clock and save</text>
  <circle cx="580" cy="243" r="4" fill="#B97A10"/>
  <text x="596" y="249" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Engine still undecided: one request</text>
  <text x="596" y="279" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">to the healthy ranks</text>
  <text x="570" y="325" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">EVERY TICK, IN ORDER</text>
  <circle cx="584" cy="355" r="13" fill="#B97A10"/>
  <text x="584" y="360" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="610" y="361" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">All active ranks healthy again → verify</text>
  <circle cx="584" cy="385" r="13" fill="#B97A10"/>
  <text x="584" y="390" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="610" y="391" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Reset decided (FT failed, no ranks)</text>
  <circle cx="584" cy="415" r="13" fill="#B97A10"/>
  <text x="584" y="420" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="610" y="421" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">75 s passed</text>
  <circle cx="584" cy="445" r="13" fill="#B97A10"/>
  <text x="584" y="450" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="610" y="451" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Still waiting, or under 2 s in</text>
  <circle cx="584" cy="475" r="13" fill="#B97A10"/>
  <text x="584" y="480" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="610" y="481" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Retry again within 2 min</text>
  <circle cx="584" cy="505" r="13" fill="#B97A10"/>
  <text x="584" y="510" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="610" y="511" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Retry or scale_down → save, send</text>
  <!-- comes from -->
  <text x="60" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">COMES FROM</text>
  <rect x="60" y="217" width="190" height="38" rx="19" fill="#E2F1E7" stroke="#2C8549" stroke-width="2.5"/>
  <text x="155" y="241" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">serving</text>
  <path d="M251,236 L538,236" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="396" y="224" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">a rank reports a fault</text>
  <rect x="60" y="437" width="190" height="38" rx="19" fill="#E2F1E7" stroke="#2C8549" stroke-width="2.5"/>
  <text x="155" y="461" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">serving</text>
  <path d="M251,456 L538,456" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="396" y="444" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">a rank is unknown</text>
  <text x="396" y="482" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">even if peers respond</text>
  <!-- goes to -->
  <text x="1160" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">GOES TO</text>
  <path d="M1101,180 L1299,180" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <circle cx="1236" cy="180" r="13" fill="#B97A10"/>
  <text x="1236" y="185" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <rect x="1300" y="161" width="190" height="38" rx="19" fill="#E2F1E7" stroke="#2C8549" stroke-width="2.5"/>
  <text x="1395" y="185" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">serving</text>
  <text x="1395" y="220" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">verified</text>
  <path d="M1101,291 L1299,291" fill="none" stroke="#B97A10" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <circle cx="1236" cy="291" r="13" fill="#B97A10"/>
  <text x="1236" y="296" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <rect x="1300" y="272" width="190" height="38" rx="19" fill="#FCF0D6" stroke="#B97A10" stroke-width="2.5"/>
  <text x="1395" y="296" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">diagnosing</text>
  <text x="1395" y="331" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">stay</text>
  <path d="M1101,401 L1299,401" fill="none" stroke="#8E5BA6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <circle cx="1236" cy="401" r="13" fill="#B97A10"/>
  <text x="1236" y="406" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  <rect x="1300" y="382" width="190" height="38" rx="19" fill="#EFE5F5" stroke="#8E5BA6" stroke-width="2.5"/>
  <text x="1395" y="406" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">applying</text>
  <text x="1395" y="441" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">round saved first</text>
  <path d="M1101,512 L1299,512" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <circle cx="1176" cy="512" r="13" fill="#B97A10"/>
  <text x="1176" y="517" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="1206" cy="512" r="13" fill="#B97A10"/>
  <text x="1206" y="517" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <circle cx="1236" cy="512" r="13" fill="#B97A10"/>
  <text x="1236" y="517" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <rect x="1300" y="493" width="190" height="38" rx="19" fill="#FFFFFF" stroke="#C0443F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="1395" y="517" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">reset</text>
  <text x="1395" y="552" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">via the budget</text>
</svg>
