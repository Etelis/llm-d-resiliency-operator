<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Engine fault state machine</title>
  <desc id="desc">Six states in three bands. Normal: starting leads to serving once every rank is healthy and verified. Recover in place: a fault moves serving to diagnosing, which sends a retry or scale_down round and moves to applying; both return to serving once a real request succeeds. Recreate: resets go through a budget of 3 per 30 minutes to resetting, which returns to starting when a new group appears, or to intervention_required, which waits for someone to replace the group.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C8549"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0443F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6BA8"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E5BA6"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B97A10"/></marker>
    <marker id="arrow-maroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1E1E"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
  </defs>
  <rect x="5" y="5" width="1590" height="910" rx="10" fill="#FFFFFF" stroke="#A46BAA" stroke-width="10"/>
  <!-- bands -->
  <rect x="30" y="40" width="1180" height="205" rx="12" fill="#F5F5F5"/>
  <text x="62" y="142" font-size="13" font-weight="700" fill="#8A8A8A" letter-spacing="3" text-anchor="middle" transform="rotate(-90 62 142)">NORMAL</text>
  <rect x="30" y="255" width="1180" height="270" rx="12" fill="#F5F5F5"/>
  <text x="62" y="390" font-size="13" font-weight="700" fill="#8A8A8A" letter-spacing="3" text-anchor="middle" transform="rotate(-90 62 390)">IN PLACE</text>
  <rect x="30" y="535" width="1180" height="355" rx="12" fill="#F5F5F5"/>
  <text x="62" y="712" font-size="13" font-weight="700" fill="#8A8A8A" letter-spacing="3" text-anchor="middle" transform="rotate(-90 62 712)">RECREATE</text>
  <!-- entry -->
  <circle cx="300" cy="62" r="7" fill="#3A3A3A"/>
  <path d="M300,69 L300,110" fill="none" stroke="#3A3A3A" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <!-- main path -->
  <path d="M420,150 L578,150" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="459" y="127" width="81" height="46" rx="6" fill="#FFFFFF"/>
  <text x="499" y="146" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">healthy,</text>
  <text x="499" y="165" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">verified</text>
  <path d="M740,188 L740,370" fill="none" stroke="#3A3A3A" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <rect x="712" y="292" width="56" height="27" rx="6" fill="#FFFFFF"/>
  <text x="740" y="310" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">fault</text>
  <path d="M660,372 L660,190" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="599" y="232" width="121" height="27" rx="6" fill="#FFFFFF"/>
  <text x="660" y="250" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">healthy again</text>
  <path d="M820,410 L938,410" fill="none" stroke="#3A3A3A" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="879" y="398" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">round sent</text>
  <path d="M1060,372 L1060,165 L822,165" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="1020" y="257" width="81" height="46" rx="6" fill="#FFFFFF"/>
  <text x="1060" y="276" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">done,</text>
  <text x="1060" y="295" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">verified</text>
  <!-- toward a reset -->
  <path d="M340,188 L340,600 L638,600" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <path d="M580,172 L560,172 L560,600" fill="none" stroke="#C0443F" stroke-width="2.5"/>
  <rect x="365" y="587" width="170" height="27" rx="6" fill="#FFFFFF"/>
  <text x="450" y="605" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">verification failed</text>
  <path d="M700,448 L700,558" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="599" y="480" width="202" height="46" rx="6" fill="#FFFFFF"/>
  <text x="700" y="499" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">reset decision, 75 s,</text>
  <text x="700" y="518" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">or retry again in 2 min</text>
  <path d="M1060,448 L1060,600 L762,600" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="983" y="501" width="154" height="46" rx="6" fill="#FFFFFF"/>
  <text x="1060" y="520" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">rejected, failed,</text>
  <text x="1060" y="539" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">or 90 s</text>
  <!-- reset budget -->
  <polygon points="700,560 760,600 700,640 640,600" fill="#FFFFFF" stroke="#C0443F" stroke-width="3"/>
  <text x="700" y="597" font-size="14" font-weight="700" text-anchor="middle" fill="#C0443F">3 per</text>
  <text x="700" y="614" font-size="14" font-weight="700" text-anchor="middle" fill="#C0443F">30 min?</text>
  <path d="M700,640 L700,680 L300,680 L300,720" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="427" y="667" width="146" height="27" rx="6" fill="#FFFFFF"/>
  <text x="500" y="685" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">under the budget</text>
  <path d="M700,680 L1060,680 L1060,720" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="815" y="667" width="129" height="27" rx="6" fill="#FFFFFF"/>
  <text x="880" y="685" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">budget used up</text>
  <!-- recreate -->
  <path d="M420,770 L938,770" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="538" y="757" width="283" height="27" rx="6" fill="#FFFFFF"/>
  <text x="680" y="775" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">old Pods still there after 10 min</text>
  <path d="M260,722 L260,190" fill="none" stroke="#3F6BA8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="216" y="432" width="89" height="46" rx="6" fill="#FFFFFF"/>
  <text x="260" y="451" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">new group</text>
  <text x="260" y="470" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">found</text>
  <path d="M180,150 L100,150 L100,865 L1060,865 L1060,800" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="487" y="852" width="186" height="27" rx="6" fill="#FFFFFF"/>
  <text x="580" y="870" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">not healthy in 10 min</text>
  <path d="M1180,745 L1200,745 L1200,128 L822,128" fill="none" stroke="#2C8549" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
  <rect x="846" y="115" width="308" height="27" rx="6" fill="#FFFFFF"/>
  <text x="1000" y="133" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">someone replaced the group, verified</text>
  <!-- states -->
  <rect x="180" y="112" width="240" height="76" rx="14" fill="#E4ECF7" stroke="#3F6BA8" stroke-width="3"/>
  <text x="300" y="146" font-size="19" font-weight="700" text-anchor="middle" fill="#1E1E1E">starting</text>
  <text x="300" y="170" font-size="14" font-weight="400" text-anchor="middle" fill="#5A5A5A">waiting for a healthy group</text>
  <rect x="580" y="112" width="240" height="76" rx="14" fill="#E2F1E7" stroke="#2C8549" stroke-width="3"/>
  <text x="700" y="146" font-size="19" font-weight="700" text-anchor="middle" fill="#1E1E1E">serving</text>
  <text x="700" y="170" font-size="14" font-weight="400" text-anchor="middle" fill="#5A5A5A">all ranks proven</text>
  <rect x="580" y="372" width="240" height="76" rx="14" fill="#FCF0D6" stroke="#B97A10" stroke-width="3"/>
  <text x="700" y="406" font-size="19" font-weight="700" text-anchor="middle" fill="#1E1E1E">diagnosing</text>
  <text x="700" y="430" font-size="14" font-weight="400" text-anchor="middle" fill="#5A5A5A">waiting for the engine</text>
  <rect x="940" y="372" width="240" height="76" rx="14" fill="#EFE5F5" stroke="#8E5BA6" stroke-width="3"/>
  <text x="1060" y="406" font-size="19" font-weight="700" text-anchor="middle" fill="#1E1E1E">applying</text>
  <text x="1060" y="430" font-size="14" font-weight="400" text-anchor="middle" fill="#5A5A5A">round sent</text>
  <rect x="180" y="722" width="240" height="76" rx="14" fill="#F9E1DF" stroke="#C0443F" stroke-width="3"/>
  <text x="300" y="756" font-size="19" font-weight="700" text-anchor="middle" fill="#1E1E1E">resetting</text>
  <text x="300" y="780" font-size="14" font-weight="400" text-anchor="middle" fill="#5A5A5A">group being recreated</text>
  <rect x="940" y="722" width="240" height="76" rx="14" fill="#F1D6D6" stroke="#8B1E1E" stroke-width="3"/>
  <text x="1060" y="756" font-size="19" font-weight="700" text-anchor="middle" fill="#1E1E1E">intervention_required</text>
  <text x="1060" y="780" font-size="14" font-weight="400" text-anchor="middle" fill="#5A5A5A">waiting for a human</text>
  <!-- legend -->
  <rect x="1230" y="40" width="345" height="850" rx="24" fill="#F4EFF7"/>
  <text x="1255" y="88" font-size="22" font-weight="700" text-anchor="start" fill="#1E1E1E">Reading the chart</text>
  <path d="M1255,130 L1310,130" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1325" y="135" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">back to serving, only after</text>
  <text x="1325" y="156" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">a real request succeeds</text>
  <path d="M1255,200 L1310,200" fill="none" stroke="#3A3A3A" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="1325" y="205" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">handling a fault</text>
  <path d="M1255,249 L1310,249" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="1325" y="254" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">toward a reset</text>
  <path d="M1255,298 L1310,298" fill="none" stroke="#3F6BA8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="1325" y="303" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">a new group appears</text>
  <path d="M1255,347 L1310,347" fill="none" stroke="#2C8549" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
  <text x="1325" y="352" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">only after someone</text>
  <text x="1325" y="373" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">replaces the group</text>
  <polygon points="1282,406 1304,421 1282,436 1260,421" fill="#FFFFFF" stroke="#C0443F" stroke-width="3"/>
  <text x="1325" y="426" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">reset budget: 3 per 30 min</text>
  <text x="1255" y="487" font-size="20" font-weight="700" text-anchor="start" fill="#1E1E1E">From any state</text>
  <circle cx="1263" cy="518" r="4" fill="#5A5A5A"/>
  <text x="1278" y="523" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">group replaced → starting</text>
  <circle cx="1263" cy="557" r="4" fill="#5A5A5A"/>
  <text x="1278" y="562" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">removed rank alive → reset</text>
  <circle cx="1263" cy="596" r="4" fill="#5A5A5A"/>
  <text x="1278" y="601" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">Kubernetes unreadable → stay,</text>
  <text x="1278" y="622" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">after 10 min → intervention</text>
  <circle cx="1263" cy="656" r="4" fill="#5A5A5A"/>
  <text x="1278" y="661" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">operator restart → same state,</text>
  <text x="1278" y="682" font-size="16" font-weight="400" text-anchor="start" fill="#1E1E1E">verified again</text>
</svg>
