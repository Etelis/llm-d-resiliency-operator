<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 544" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">serving state</title>
  <desc id="desc">serving is entered from starting, diagnosing, applying or intervention_required, always after a successful verification. Healthy ticks do nothing. A frontend-only problem is checked against the healthy ranks. A fault moves to diagnosing; a failed re-verification resets.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C8549"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0443F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6BA8"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E5BA6"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B97A10"/></marker>
    <marker id="arrow-maroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1E1E"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
  </defs>
  <rect x="5" y="5" width="1590" height="534" rx="10" fill="#FFFFFF" stroke="#A46BAA" stroke-width="10"/>
  <!-- state -->
  <rect x="540" y="45" width="560" height="454" rx="18" fill="#E2F1E7" stroke="#2C8549" stroke-width="3"/>
  <text x="570" y="93" font-size="28" font-weight="700" text-anchor="start" fill="#1E1E1E">serving</text>
  <text x="570" y="123" font-size="17" font-weight="400" text-anchor="start" fill="#5A5A5A">all ranks proven</text>
  <text x="570" y="185" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">EVERY TICK, IN ORDER</text>
  <circle cx="584" cy="215" r="13" fill="#2C8549"/>
  <text x="584" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="610" y="221" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">All healthy and verified → nothing</text>
  <circle cx="584" cy="245" r="13" fill="#2C8549"/>
  <text x="584" y="250" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="610" y="251" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Healthy, not verified yet → verify</text>
  <circle cx="584" cy="275" r="13" fill="#2C8549"/>
  <text x="584" y="280" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="610" y="281" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">API down, rest healthy → check the rest</text>
  <circle cx="584" cy="305" r="13" fill="#2C8549"/>
  <text x="584" y="310" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="610" y="311" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">A rank reports a fault</text>
  <!-- comes from -->
  <text x="60" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">COMES FROM</text>
  <rect x="60" y="153" width="190" height="38" rx="19" fill="#E4ECF7" stroke="#3F6BA8" stroke-width="2.5"/>
  <text x="155" y="177" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">starting</text>
  <path d="M251,172 L538,172" fill="none" stroke="#3F6BA8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="396" y="160" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">verified</text>
  <rect x="60" y="246" width="190" height="38" rx="19" fill="#FCF0D6" stroke="#B97A10" stroke-width="2.5"/>
  <text x="155" y="270" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">diagnosing</text>
  <path d="M251,265 L538,265" fill="none" stroke="#B97A10" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="396" y="253" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">healthy again, verified</text>
  <rect x="60" y="340" width="190" height="38" rx="19" fill="#EFE5F5" stroke="#8E5BA6" stroke-width="2.5"/>
  <text x="155" y="364" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">applying</text>
  <path d="M251,359 L538,359" fill="none" stroke="#8E5BA6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="396" y="347" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">round done, verified</text>
  <rect x="60" y="433" width="190" height="38" rx="19" fill="#F1D6D6" stroke="#8B1E1E" stroke-width="2.5"/>
  <text x="155" y="457" font-size="14" font-weight="700" text-anchor="middle" fill="#1E1E1E">intervention_required</text>
  <path d="M251,452 L538,452" fill="none" stroke="#8B1E1E" stroke-width="2.5" marker-end="url(#arrow-maroon)"/>
  <text x="396" y="440" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">new group, verified</text>
  <!-- goes to -->
  <text x="1160" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">GOES TO</text>
  <path d="M1101,187 L1299,187" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <circle cx="1176" cy="187" r="13" fill="#2C8549"/>
  <text x="1176" y="192" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="1206" cy="187" r="13" fill="#2C8549"/>
  <text x="1206" y="192" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="1236" cy="187" r="13" fill="#2C8549"/>
  <text x="1236" y="192" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <rect x="1300" y="168" width="190" height="38" rx="19" fill="#E2F1E7" stroke="#2C8549" stroke-width="2.5"/>
  <text x="1395" y="192" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">serving</text>
  <text x="1395" y="227" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">stay</text>
  <path d="M1101,312 L1299,312" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <circle cx="1236" cy="312" r="13" fill="#2C8549"/>
  <text x="1236" y="317" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <rect x="1300" y="293" width="190" height="38" rx="19" fill="#FFFFFF" stroke="#C0443F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="1395" y="317" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">reset</text>
  <text x="1395" y="352" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">verification fails</text>
  <path d="M1101,437 L1299,437" fill="none" stroke="#B97A10" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <circle cx="1206" cy="437" r="13" fill="#2C8549"/>
  <text x="1206" y="442" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <circle cx="1236" cy="437" r="13" fill="#2C8549"/>
  <text x="1236" y="442" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <rect x="1300" y="418" width="190" height="38" rx="19" fill="#FCF0D6" stroke="#B97A10" stroke-width="2.5"/>
  <text x="1395" y="442" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">diagnosing</text>
  <text x="1395" y="477" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">check fails, or a fault</text>
</svg>
