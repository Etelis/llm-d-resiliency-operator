<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 522" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">resetting state</title>
  <desc id="desc">resetting is entered through the reset budget. On entry the leader Pod is deleted by UID and LWS recreates the group. Each tick it waits; old Pods get the delete again; after 10 minutes it gives up; once no old Pod is left it goes to starting.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C8549"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0443F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6BA8"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E5BA6"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B97A10"/></marker>
    <marker id="arrow-maroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1E1E"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
  </defs>
  <rect x="5" y="5" width="1590" height="512" rx="10" fill="#FFFFFF" stroke="#A46BAA" stroke-width="10"/>
  <!-- state -->
  <rect x="540" y="45" width="560" height="432" rx="18" fill="#F9E1DF" stroke="#C0443F" stroke-width="3"/>
  <text x="570" y="93" font-size="28" font-weight="700" text-anchor="start" fill="#1E1E1E">resetting</text>
  <text x="570" y="123" font-size="17" font-weight="400" text-anchor="start" fill="#5A5A5A">group being recreated</text>
  <text x="570" y="185" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">ON ENTRY</text>
  <circle cx="580" cy="213" r="4" fill="#C0443F"/>
  <text x="596" y="219" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Save, then delete the leader Pod</text>
  <text x="596" y="249" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">by UID; LWS recreates the group</text>
  <text x="570" y="295" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">EVERY TICK, IN ORDER</text>
  <circle cx="584" cy="325" r="13" fill="#C0443F"/>
  <text x="584" y="330" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="610" y="331" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Kubernetes unreadable → wait</text>
  <circle cx="584" cy="355" r="13" fill="#C0443F"/>
  <text x="584" y="360" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="610" y="361" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Old Pods still there after 10 min</text>
  <circle cx="584" cy="385" r="13" fill="#C0443F"/>
  <text x="584" y="390" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="610" y="391" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Old Pods still there → delete again</text>
  <circle cx="584" cy="415" r="13" fill="#C0443F"/>
  <text x="584" y="420" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="610" y="421" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">No old Pod left</text>
  <!-- comes from -->
  <text x="60" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">COMES FROM</text>
  <rect x="60" y="282" width="190" height="38" rx="19" fill="#FFFFFF" stroke="#C0443F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="155" y="306" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">reset</text>
  <text x="265" y="295" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">under 3 resets</text>
  <text x="265" y="317" font-size="16" font-weight="400" text-anchor="start" fill="#5A5A5A">in 30 min</text>
  <path d="M468,301 L536,301" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <!-- goes to -->
  <text x="1160" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">GOES TO</text>
  <path d="M1104,184 L1224,184" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <circle cx="1244" cy="184" r="13" fill="#C0443F"/>
  <text x="1244" y="189" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="1274" cy="184" r="13" fill="#C0443F"/>
  <text x="1274" y="189" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <rect x="1300" y="165" width="190" height="38" rx="19" fill="#F9E1DF" stroke="#C0443F" stroke-width="2.5"/>
  <text x="1395" y="189" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">resetting</text>
  <text x="1395" y="224" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">stay</text>
  <path d="M1104,301 L1224,301" fill="none" stroke="#8B1E1E" stroke-width="2.5" marker-end="url(#arrow-maroon)"/>
  <circle cx="1244" cy="301" r="13" fill="#C0443F"/>
  <text x="1244" y="306" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="1274" cy="301" r="13" fill="#C0443F"/>
  <text x="1274" y="306" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <rect x="1300" y="282" width="190" height="38" rx="19" fill="#F1D6D6" stroke="#8B1E1E" stroke-width="2.5"/>
  <text x="1395" y="306" font-size="14" font-weight="700" text-anchor="middle" fill="#1E1E1E">intervention_required</text>
  <text x="1395" y="341" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">after 10 min</text>
  <path d="M1104,418 L1254,418" fill="none" stroke="#3F6BA8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <circle cx="1274" cy="418" r="13" fill="#C0443F"/>
  <text x="1274" y="423" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <rect x="1300" y="399" width="190" height="38" rx="19" fill="#E4ECF7" stroke="#3F6BA8" stroke-width="2.5"/>
  <text x="1395" y="423" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">starting</text>
  <text x="1395" y="458" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">clean slate</text>
</svg>
