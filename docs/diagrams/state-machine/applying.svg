<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 552" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">applying state</title>
  <desc id="desc">applying is entered from diagnosing once a retry or scale_down round has been saved and sent. Each tick it reads the participants. Death, FT failure, a different round or 90 seconds reset the group; all participants healthy leads to verification and serving. A round is never sent twice.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C8549"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0443F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6BA8"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E5BA6"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B97A10"/></marker>
    <marker id="arrow-maroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1E1E"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
  </defs>
  <rect x="5" y="5" width="1590" height="542" rx="10" fill="#FFFFFF" stroke="#A46BAA" stroke-width="10"/>
  <!-- state -->
  <rect x="540" y="45" width="560" height="462" rx="18" fill="#EFE5F5" stroke="#8E5BA6" stroke-width="3"/>
  <text x="570" y="93" font-size="28" font-weight="700" text-anchor="start" fill="#1E1E1E">applying</text>
  <text x="570" y="123" font-size="17" font-weight="400" text-anchor="start" fill="#5A5A5A">round sent</text>
  <text x="570" y="185" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">ON ENTRY</text>
  <circle cx="580" cy="213" r="4" fill="#8E5BA6"/>
  <text x="596" y="219" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Send the round to every participant</text>
  <text x="596" y="249" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">at once; any refusal → reset</text>
  <text x="570" y="295" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">EVERY TICK, IN ORDER</text>
  <circle cx="584" cy="325" r="13" fill="#8E5BA6"/>
  <text x="584" y="330" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="610" y="331" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">A participant died or FT failed</text>
  <circle cx="584" cy="355" r="13" fill="#8E5BA6"/>
  <text x="584" y="360" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="610" y="361" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">A participant runs a different round</text>
  <circle cx="584" cy="385" r="13" fill="#8E5BA6"/>
  <text x="584" y="390" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="610" y="391" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">All participants healthy → verify</text>
  <circle cx="584" cy="415" r="13" fill="#8E5BA6"/>
  <text x="584" y="420" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="610" y="421" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">90 s passed</text>
  <circle cx="584" cy="445" r="13" fill="#8E5BA6"/>
  <text x="584" y="450" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="610" y="451" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Otherwise wait, never re-send</text>
  <!-- comes from -->
  <text x="60" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">COMES FROM</text>
  <rect x="60" y="297" width="190" height="38" rx="19" fill="#FCF0D6" stroke="#B97A10" stroke-width="2.5"/>
  <text x="155" y="321" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">diagnosing</text>
  <path d="M251,316 L538,316" fill="none" stroke="#B97A10" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="396" y="304" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">retry or scale_down,</text>
  <text x="396" y="342" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">round saved first</text>
  <!-- goes to -->
  <text x="1160" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">GOES TO</text>
  <path d="M1101,189 L1299,189" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <circle cx="1236" cy="189" r="13" fill="#8E5BA6"/>
  <text x="1236" y="194" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <rect x="1300" y="170" width="190" height="38" rx="19" fill="#E2F1E7" stroke="#2C8549" stroke-width="2.5"/>
  <text x="1395" y="194" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">serving</text>
  <text x="1395" y="229" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">removed ranks stay out</text>
  <path d="M1101,316 L1299,316" fill="none" stroke="#8E5BA6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <circle cx="1236" cy="316" r="13" fill="#8E5BA6"/>
  <text x="1236" y="321" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <rect x="1300" y="297" width="190" height="38" rx="19" fill="#EFE5F5" stroke="#8E5BA6" stroke-width="2.5"/>
  <text x="1395" y="321" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">applying</text>
  <text x="1395" y="356" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">stay</text>
  <path d="M1101,443 L1299,443" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <circle cx="1176" cy="443" r="13" fill="#8E5BA6"/>
  <text x="1176" y="448" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="1206" cy="443" r="13" fill="#8E5BA6"/>
  <text x="1206" y="448" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="1236" cy="443" r="13" fill="#8E5BA6"/>
  <text x="1236" y="448" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <rect x="1300" y="424" width="190" height="38" rx="19" fill="#FFFFFF" stroke="#C0443F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="1395" y="448" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">reset</text>
  <text x="1395" y="483" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">or a refusal on entry</text>
</svg>
