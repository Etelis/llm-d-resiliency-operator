<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 544" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">starting state</title>
  <desc id="desc">starting is entered on first start, when a new group appears, when only some Pods were replaced, or from resetting. Each tick it waits for every active rank to be healthy and then verifies. It goes to serving, to a reset if verification fails, or to intervention_required after 10 minutes.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A3A"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C8549"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0443F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6BA8"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E5BA6"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B97A10"/></marker>
    <marker id="arrow-maroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1E1E"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
  </defs>
  <rect x="5" y="5" width="1590" height="534" rx="10" fill="#FFFFFF" stroke="#A46BAA" stroke-width="10"/>
  <!-- state -->
  <rect x="540" y="45" width="560" height="454" rx="18" fill="#E4ECF7" stroke="#3F6BA8" stroke-width="3"/>
  <text x="570" y="93" font-size="28" font-weight="700" text-anchor="start" fill="#1E1E1E">starting</text>
  <text x="570" y="123" font-size="17" font-weight="400" text-anchor="start" fill="#5A5A5A">waiting for a healthy group</text>
  <text x="570" y="185" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">EVERY TICK, IN ORDER</text>
  <circle cx="584" cy="215" r="13" fill="#3F6BA8"/>
  <text x="584" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="610" y="221" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">All active ranks healthy → verify</text>
  <circle cx="584" cy="245" r="13" fill="#3F6BA8"/>
  <text x="584" y="250" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="610" y="251" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Verification fails</text>
  <circle cx="584" cy="275" r="13" fill="#3F6BA8"/>
  <text x="584" y="280" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="610" y="281" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">10 min passed</text>
  <circle cx="584" cy="305" r="13" fill="#3F6BA8"/>
  <text x="584" y="310" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="610" y="311" font-size="19" font-weight="400" text-anchor="start" fill="#1E1E1E">Otherwise keep waiting</text>
  <!-- comes from -->
  <text x="60" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">COMES FROM</text>
  <rect x="60" y="168" width="190" height="38" rx="19" fill="#EDEDED" stroke="#7A7A7A" stroke-width="2.5"/>
  <text x="155" y="192" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">any state</text>
  <path d="M251,187 L538,187" fill="none" stroke="#7A7A7A" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="396" y="175" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">first start,</text>
  <text x="396" y="213" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">or a new group</text>
  <rect x="60" y="293" width="190" height="38" rx="19" fill="#EDEDED" stroke="#7A7A7A" stroke-width="2.5"/>
  <text x="155" y="317" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">any state</text>
  <path d="M251,312 L538,312" fill="none" stroke="#7A7A7A" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="396" y="300" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">only some Pods replaced,</text>
  <text x="396" y="338" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">wait for the rest</text>
  <rect x="60" y="418" width="190" height="38" rx="19" fill="#F9E1DF" stroke="#C0443F" stroke-width="2.5"/>
  <text x="155" y="442" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">resetting</text>
  <path d="M251,437 L538,437" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="396" y="425" font-size="16" font-weight="400" text-anchor="middle" fill="#5A5A5A">replacement group found</text>
  <!-- goes to -->
  <text x="1160" y="75" font-size="14" font-weight="700" text-anchor="start" fill="#5A5A5A" letter-spacing="2">GOES TO</text>
  <path d="M1101,172 L1299,172" fill="none" stroke="#2C8549" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <circle cx="1236" cy="172" r="13" fill="#3F6BA8"/>
  <text x="1236" y="177" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <rect x="1300" y="153" width="190" height="38" rx="19" fill="#E2F1E7" stroke="#2C8549" stroke-width="2.5"/>
  <text x="1395" y="177" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">serving</text>
  <text x="1395" y="212" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">verified</text>
  <path d="M1101,265 L1299,265" fill="none" stroke="#C0443F" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <circle cx="1236" cy="265" r="13" fill="#3F6BA8"/>
  <text x="1236" y="270" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <rect x="1300" y="246" width="190" height="38" rx="19" fill="#FFFFFF" stroke="#C0443F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="1395" y="270" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">reset</text>
  <text x="1395" y="305" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">via the budget</text>
  <path d="M1101,359 L1299,359" fill="none" stroke="#8B1E1E" stroke-width="2.5" marker-end="url(#arrow-maroon)"/>
  <circle cx="1236" cy="359" r="13" fill="#3F6BA8"/>
  <text x="1236" y="364" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <rect x="1300" y="340" width="190" height="38" rx="19" fill="#F1D6D6" stroke="#8B1E1E" stroke-width="2.5"/>
  <text x="1395" y="364" font-size="14" font-weight="700" text-anchor="middle" fill="#1E1E1E">intervention_required</text>
  <path d="M1101,452 L1299,452" fill="none" stroke="#3F6BA8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <circle cx="1236" cy="452" r="13" fill="#3F6BA8"/>
  <text x="1236" y="457" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <rect x="1300" y="433" width="190" height="38" rx="19" fill="#E4ECF7" stroke="#3F6BA8" stroke-width="2.5"/>
  <text x="1395" y="457" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">starting</text>
  <text x="1395" y="492" font-size="15" font-weight="400" text-anchor="middle" fill="#5A5A5A">stay</text>
</svg>
