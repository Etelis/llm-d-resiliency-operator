<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Engine fault recovery</title>
  <desc id="desc">The IRO controller, elected leader of the resiliency operator, keeps its state in the ft-state ConfigMap journal. When a rank in the LeaderWorkerSet group faults, the router stops sending it traffic, IRO reads every rank and diagnoses, saves a recovery round and sends it to the ranks, verifies with a real request, and if recovery fails deletes Pod 0 so LWS recreates the group.</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E5BA6"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/>
    </marker>
  </defs>

  <!-- frame -->
  <rect x="5" y="5" width="1590" height="630" rx="10" fill="#FFFFFF" stroke="#A46BAA" stroke-width="10"/>

  <!-- router -->
  <rect x="70" y="95" width="250" height="70" fill="#E8E8E8"/>
  <text x="195" y="139" font-size="24" font-weight="700" text-anchor="middle" fill="#1E1E1E">llm-d EPP</text>
  <line x1="195" y1="165" x2="195" y2="258" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="210" y="218" font-size="16" fill="#555555">engine health</text>

  <!-- operator -->
  <rect x="420" y="38" width="650" height="170" rx="26" fill="none" stroke="#8E5BA6" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="1050" y="78" font-size="24" font-weight="700" text-anchor="end" fill="#1E1E1E">Resiliency Operator</text>
  <rect x="450" y="95" width="270" height="84" fill="#FFFFFF" stroke="#8E5BA6" stroke-width="3.5"/>
  <text x="585" y="134" font-size="24" font-weight="700" text-anchor="middle" fill="#1E1E1E">IRO Controller</text>
  <text x="585" y="161" font-size="16" text-anchor="middle" fill="#555555">leader-elected</text>
  <rect x="800" y="103" width="240" height="68" fill="#E8E8E8"/>
  <text x="920" y="132" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">ft-state</text>
  <text x="920" y="157" font-size="16" text-anchor="middle" fill="#555555">ConfigMap journal</text>
  <line x1="724" y1="137" x2="796" y2="137" stroke="#8E5BA6" stroke-width="2.5" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>

  <!-- LWS group -->
  <rect x="30" y="262" width="1180" height="350" fill="#EFEFEF"/>
  <text x="1190" y="300" font-size="26" font-weight="700" text-anchor="end" fill="#1E1E1E">LeaderWorkerSet group</text>

  <!-- Pod 0 -->
  <rect x="70" y="318" width="440" height="262" rx="16" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="92" y="348" font-size="18" fill="#1E1E1E">Pod 0 (leader)</text>
  <rect x="100" y="366" width="380" height="184" rx="18" fill="#E4D7EC"/>
  <rect x="120" y="384" width="340" height="146" fill="#F8F8F8"/>
  <text x="290" y="414" font-size="18" font-weight="700" text-anchor="middle" fill="#1E1E1E">engine DP ranks</text>
  <rect x="170" y="438" width="96" height="54" rx="4" fill="#FCEFD2" stroke="#CFA032" stroke-width="2"/>
  <text x="218" y="471" font-size="18" text-anchor="middle" fill="#1E1E1E">r0</text>
  <rect x="314" y="438" width="96" height="54" rx="4" fill="#FCEFD2" stroke="#CFA032" stroke-width="2"/>
  <text x="362" y="471" font-size="18" text-anchor="middle" fill="#1E1E1E">r1</text>

  <!-- Pods 1..N -->
  <rect x="730" y="318" width="440" height="262" rx="16" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="752" y="348" font-size="18" fill="#1E1E1E">Pods 1..N (workers)</text>
  <rect x="752" y="360" width="370" height="184" rx="18" fill="#E4D7EC" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="760" y="368" width="370" height="184" rx="18" fill="#E4D7EC" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="768" y="376" width="370" height="184" rx="18" fill="#E4D7EC" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="788" y="394" width="330" height="146" fill="#F8F8F8"/>
  <text x="953" y="424" font-size="18" font-weight="700" text-anchor="middle" fill="#1E1E1E">engine DP ranks</text>
  <rect x="828" y="448" width="96" height="54" rx="4" fill="#FCEFD2" stroke="#CFA032" stroke-width="2"/>
  <text x="876" y="481" font-size="18" text-anchor="middle" fill="#1E1E1E">r2</text>
  <rect x="972" y="448" width="96" height="54" rx="4" fill="#FCEFD2" stroke="#CFA032" stroke-width="2"/>
  <text x="1020" y="481" font-size="18" text-anchor="middle" fill="#1E1E1E">r3</text>

  <!-- DP / EP link -->
  <line x1="510" y1="470" x2="730" y2="470" stroke="#333333" stroke-width="2"/>
  <rect x="575" y="452" width="90" height="36" rx="4" fill="#E4D7EC"/>
  <text x="620" y="476" font-size="18" text-anchor="middle" fill="#1E1E1E">DP / EP</text>
  <circle cx="620" cy="418" r="17" fill="#8E5BA6"/>
  <text x="620" y="424" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>

  <!-- IRO to group -->
  <line x1="520" y1="262" x2="520" y2="183" stroke="#8E5BA6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <circle cx="520" cy="225" r="17" fill="#8E5BA6"/>
  <text x="520" y="231" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <line x1="600" y1="181" x2="600" y2="258" stroke="#8E5BA6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <circle cx="600" cy="225" r="17" fill="#8E5BA6"/>
  <text x="600" y="231" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <line x1="680" y1="181" x2="680" y2="258" stroke="#8E5BA6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <circle cx="680" cy="225" r="17" fill="#8E5BA6"/>
  <text x="680" y="231" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <path d="M450,150 L390,150 L390,314" fill="none" stroke="#8E5BA6" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <circle cx="390" cy="225" r="17" fill="#FFFFFF" stroke="#8E5BA6" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="390" y="231" font-size="18" font-weight="700" text-anchor="middle" fill="#8E5BA6">5</text>

  <!-- legend -->
  <rect x="1220" y="38" width="360" height="574" rx="26" fill="#F4EFF7"/>
  <text x="1250" y="90" font-size="24" font-weight="700" fill="#1E1E1E">When a rank faults</text>

  <circle cx="1265" cy="150" r="17" fill="#8E5BA6"/>
  <text x="1265" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="1296" y="146" font-size="17" fill="#1E1E1E">A rank faults, the others stall.</text>
  <text x="1296" y="170" font-size="17" fill="#1E1E1E">EPP stops routing to them.</text>

  <circle cx="1265" cy="245" r="17" fill="#8E5BA6"/>
  <text x="1265" y="251" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="1296" y="241" font-size="17" fill="#1E1E1E">IRO reads every rank</text>
  <text x="1296" y="265" font-size="17" fill="#1E1E1E">and diagnoses the fault.</text>

  <circle cx="1265" cy="340" r="17" fill="#8E5BA6"/>
  <text x="1265" y="346" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="1296" y="336" font-size="17" fill="#1E1E1E">Saves the round, then sends</text>
  <text x="1296" y="360" font-size="17" fill="#1E1E1E">retry or scale_down.</text>

  <circle cx="1265" cy="435" r="17" fill="#8E5BA6"/>
  <text x="1265" y="441" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="1296" y="431" font-size="17" fill="#1E1E1E">Verifies with a real request,</text>
  <text x="1296" y="455" font-size="17" fill="#1E1E1E">the group serves again.</text>

  <circle cx="1265" cy="530" r="17" fill="#FFFFFF" stroke="#8E5BA6" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="1265" y="536" font-size="18" font-weight="700" text-anchor="middle" fill="#8E5BA6">5</text>
  <text x="1296" y="526" font-size="17" fill="#1E1E1E">Still failing: delete Pod 0,</text>
  <text x="1296" y="550" font-size="17" fill="#1E1E1E">LWS recreates the group.</text>
</svg>
