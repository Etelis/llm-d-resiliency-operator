apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-resiliency-operator
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - --leader-elect
        - --enable-vllm-ft
        - --vllm-lws=wide-ep
        - --vllm-namespace=default
        - --vllm-model=model
        - --vllm-local-ranks=2
        - --vllm-min-survivors=2
        env:
        - name: IRO_VERIFICATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: iro-vllm-ft
              key: token
        ports:
        - name: admission
          containerPort: 8090
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
